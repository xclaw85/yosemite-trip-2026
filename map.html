<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yosemite Trip Map · August 3–6, 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sign:#4A3728; --sign-deep:#33261B; --routed:#F2EDE4;
  --paper:#E9E5DA; --paper-2:#DFDACC; --ink:#2A2520;
  --granite:#7C7A73; --pine:#2E4237; --merced:#3F6E6C; --ember:#B4552A;
  --rule:rgba(42,37,32,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--sign-deep);color:var(--routed);-webkit-font-smoothing:antialiased;}
.shell{display:flex;flex-direction:column;height:100%;}
header{background:var(--sign);padding:13px 22px 11px;flex:0 0 auto;border-bottom:1px solid rgba(242,237,228,.16);}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#BFB6A5;margin:0 0 3px;}
h1{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:clamp(18px,3vw,26px);margin:0;}
header a{color:#C9C2B4;font-size:12.5px;}
.mapsec{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
.maprow{flex:1 1 auto;min-height:0;}
#map{min-height:0;height:100%;}
.mapside{max-height:none;}
/* ---------- map ---------- */
.mapsec{padding:0;border-top:0;background:var(--sign-deep);}
.maptop{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 22px;background:var(--sign);border-bottom:1px solid rgba(242,237,228,.16);
}
.daytabs{display:flex;flex-wrap:wrap;gap:6px;}
.daytab{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;color:#C9C2B4;border:1.5px solid rgba(242,237,228,.28);
  padding:6px 13px;font:inherit;font-size:12.5px;font-weight:500;border-radius:999px;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.daytab:hover{border-color:var(--routed);color:var(--routed);}
.daytab.on{background:var(--routed);color:var(--sign-deep);border-color:var(--routed);}
.daytab:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}
.daytab .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.basetoggle{display:flex;border:1.5px solid rgba(242,237,228,.28);border-radius:999px;overflow:hidden;}
.basebtn{
  cursor:pointer;background:transparent;color:#C9C2B4;border:0;font:inherit;
  font-size:12px;font-weight:500;padding:6px 15px;transition:background .12s ease,color .12s ease;
}
.basebtn.on{background:var(--routed);color:var(--sign-deep);}
.basebtn:focus-visible{outline:2px solid var(--ember);outline-offset:-2px;}
.maprow{display:flex;min-height:540px;}
#map{flex:1 1 auto;min-height:540px;background:#E4E0D8;}
.mapside{
  flex:0 0 320px;max-height:640px;overflow-y:auto;
  background:var(--sign-deep);color:var(--routed);
  border-left:1px solid rgba(242,237,228,.14);
}
.mapfoot{
  padding:14px 18px 22px;font-size:11.5px;line-height:1.6;color:#8F8676;
  font-family:"IBM Plex Mono",monospace;max-width:none;
}
.daygroup{border-bottom:1px solid rgba(242,237,228,.14);}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:13px 18px 5px;}
.dayhead .d{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:14.5px;}
.dayhead .t{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#8F8676;
}
.stop{
  width:100%;text-align:left;display:block;background:none;
  border:0;border-left:3px solid transparent;padding:9px 18px 11px;
  cursor:pointer;color:inherit;font:inherit;
  transition:background .12s ease,border-color .12s ease;
}
.stop:hover,.stop:focus-visible{background:rgba(242,237,228,.06);border-left-color:var(--ember);}
.stop:focus-visible{outline:2px solid var(--routed);outline-offset:-2px;}
.stop .row{display:flex;align-items:center;gap:9px;}
.stop .nm{font-weight:600;font-size:13.5px;line-height:1.3;}
.stop .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#8F8676;margin-top:4px;display:block;padding-left:31px;}
.pinmini{
  width:22px;height:22px;border-radius:50%;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;color:#fff;
}
.pinnum{
  width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;color:#fff;
}
.pinnum::before{content:attr(data-n);}
.leaflet-marker-icon .pinnum{line-height:1;}
.leaflet-marker-icon .pinnum > *{transform:rotate(45deg);}
.leaflet-popup-content-wrapper{background:var(--sign);color:var(--routed);border-radius:3px;}
.leaflet-popup-tip{background:var(--sign);}
.leaflet-popup-content{margin:13px 15px;font-size:13px;line-height:1.5;min-width:210px;}
.leaflet-popup-content b{font-family:"Zilla Slab",Georgia,serif;font-size:15px;display:block;margin-bottom:2px;}
.leaflet-popup-content .pm{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#C9C2B4;display:block;margin-bottom:7px;}
.leaflet-popup-content a{color:#EBC9A8;}
.leaflet-container a.leaflet-popup-close-button{color:#C9C2B4;}
.leaflet-bar a{background:var(--paper);color:var(--ink);border-bottom-color:var(--rule);}
.leaflet-bar a:hover{background:var(--paper-2);}


@media (max-width:860px){
  .maprow{flex-direction:column;min-height:0;}
  #map{min-height:52vh;flex:0 0 52vh;height:auto;}
  .mapside{flex:1 1 auto;border-left:0;border-top:1px solid rgba(242,237,228,.14);}
  .maptop{padding:10px 16px;}
  .daytab{font-size:12px;padding:5px 11px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <p class="eyebrow">Yosemite National Park &middot; 3 nights, Curry Village</p>
    <h1>Trip Map &mdash; August 3 to 6, 2026</h1>
    <a href="index.html">&larr; Back to the full trip plan</a>
  </header>
  <div class="mapsec">
    <div class="maptop">
      <div id="daytabs" class="daytabs" role="group" aria-label="Filter map by day"></div>
      <div class="basetoggle" role="group" aria-label="Base map style">
        <button class="basebtn on" type="button" data-base="map">Map</button>
        <button class="basebtn" type="button" data-base="terrain">Terrain</button>
      </div>
    </div>
    <div class="maprow">
      <div id="map" role="application" aria-label="Interactive map of all trip stops"></div>
      <div class="mapside">
        <div id="list"></div>
        <p class="mapfoot">Gas, gate and visitor-centre pins stay visible on every day. Dashed lines show the driving order, not the exact road.</p>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STOPS = [
  // day: 0 = logistics (both directions), 1..4 = Mon..Thu
  {i:1,  day:0, d:"Logistics",  n:"Lake Arrowhead, CA",              lat:34.2483,    lon:-117.1897,    ft:5100, tm:"Depart 5:30 AM",  note:"~350 mi each way, 6.5 hrs driving. CA-18 &rarr; I-15 N &rarr; US-395 N &rarr; CA-58 W &rarr; CA-99 N &rarr; CA-41 N."},
  {i:2,  day:0, d:"Logistics",  n:"Oakhurst, CA",                    lat:37.3277,    lon:-119.6482,    ft:2300, tm:"12:30 PM",        note:"LAST AFFORDABLE FUEL. There is no gas station in Yosemite Valley. Fill up here in both directions."},
  {i:3,  day:0, d:"Logistics",  n:"South Entrance Station",          lat:37.5108,    lon:-119.6494,    ft:5120, tm:"1:15 PM",         note:"$35 per vehicle, good 7 days. Card only, no cash. Pre-buy on Recreation.gov. Expect a 30&ndash;90 min line."},
  {i:4,  day:1, d:"Mon Aug 3",  n:"Tunnel View",                     lat:37.7157987, lon:-119.6774827, ft:4400, tm:"2:45 PM",         note:"First look at the Valley, right after the Wawona Tunnel. Parking on both sides of Hwy 41."},
  {i:5,  day:1, d:"Mon Aug 3",  n:"Curry Village",                   lat:37.7384615, lon:-119.5748224, ft:4000, tm:"Check in 4:00 PM",note:"Basecamp for 3 nights. Check-in 4:00 PM sharp, check-out Thu 11:00 AM. Park once and leave the car. Front desk 209-372-8333."},
  {i:6,  day:0, d:"Logistics",  n:"Yosemite Valley Welcome Center",  lat:37.7485922, lon:-119.587361,  ft:4000, tm:"Open 9&ndash;5",  note:"Confirm the Mist Trail closure status here and pick up the current Yosemite Guide for ranger program times."},
  {i:7,  day:2, d:"Tue Aug 4",  n:"Glacier Point",                   lat:37.7281509, lon:-119.5734999, ft:7214, tm:"8:30 AM",         note:"Escape day. 7,214 ft runs 10&ndash;15&deg;F cooler than the Valley. 60 mi round trip. Lot fills mid-morning. NO drinking water here."},
  {i:8,  day:2, d:"Tue Aug 4",  n:"Sentinel Dome &amp; Taft Point TH",lat:37.7126007,lon:-119.5863257, ft:7700, tm:"11:00 AM",        note:"Two easy hikes from one trailhead, 2.2 mi RT each. Sentinel Dome is a 360&deg; summit. Taft Point has unrailed fissures &mdash; keep well back."},
  {i:9,  day:3, d:"Wed Aug 5",  n:"Happy Isles Trailhead",           lat:37.7326,    lon:-119.5583,    ft:4000, tm:"5:45 AM",         note:"Shuttle stop #16. Mist Trail above the footbridge is CLOSED Mon&ndash;Thu 7:00 AM&ndash;3:30 PM, so take the John Muir Trail up."},
  {i:10, day:3, d:"Wed Aug 5",  n:"Top of Vernal Fall",              lat:37.7273,    lon:-119.5433,    ft:5000, tm:"8:00 AM",         note:"Via the JMT and Clark Point cutoff: 5.4 mi RT, ~1,300 ft. Carry 2 litres each. Do not cross the railings."},
  {i:11, day:3, d:"Wed Aug 5",  n:"Swinging Bridge Picnic Area",     lat:37.7364018, lon:-119.5993836, ft:3950, tm:"12:30 PM",        note:"Shade, tables, grills, easiest Merced River access in the Valley. Where you sit out the afternoon heat."},
  {i:12, day:3, d:"Wed Aug 5",  n:"Bridalveil Fall",                 lat:37.716669,  lon:-119.6463888, ft:4000, tm:"5:30 PM",         note:"0.5 mi RT on a rebuilt paved path. Still flowing in August, unlike Yosemite Falls."},
  {i:13, day:4, d:"Thu Aug 6",  n:"Mirror Lake",                     lat:37.7477377, lon:-119.5494208, ft:4100, tm:"6:15 AM",         note:"2 mi RT paved, mostly shaded along Tenaya Creek. Shallow pools by August, but the best straight-up Half Dome view in the park."},
  {i:14, day:4, d:"Thu Aug 6",  n:"Wawona Swinging Bridge",          lat:37.5433646, lon:-119.6286207, ft:4000, tm:"12:15 PM",        note:"Half-mile flat walk to a swimming hole on the South Fork Merced. Bring flip flops. Vault toilet at the lot."},
  {i:15, day:4, d:"Thu Aug 6",  n:"Mariposa Grove Welcome Plaza",    lat:37.5066944, lon:-119.6300274, ft:5100, tm:"1:30 PM",         note:"Park here and ride the free shuttle. Grizzly Giant Loop is 2 mi and ~300 ft, shaded, at 5,600 ft. Your only giant sequoias."}
];

const DAYS = [
  {k:0, label:"Logistics", short:"Gas &amp; gates", color:"#7C7A73"},
  {k:1, label:"Mon Aug 3", short:"Drive in",       color:"#B4552A"},
  {k:2, label:"Tue Aug 4", short:"Glacier Point",  color:"#2E4237"},
  {k:3, label:"Wed Aug 5", short:"Vernal Fall",    color:"#3F6E6C"},
  {k:4, label:"Thu Aug 6", short:"Homeward",       color:"#A8862C"}
];

// Driving/walking order for each day's route line, by stop id
const ROUTES = {
  1:[3,4,5],
  2:[5,7,8,5],
  3:[5,9,10,9,11,12,5],
  4:[5,13,5,14,15,3]
};

const byId = {}; STOPS.forEach(s => byId[s.i] = s);
const dayColor = k => (DAYS.find(d => d.k === k) || {}).color;

const map = L.map('map', {scrollWheelZoom:false, zoomControl:true});
map.on('click', () => map.scrollWheelZoom.enable());
map.on('mouseout', () => map.scrollWheelZoom.disable());

const BASE = {
  map: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:20,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }),
  terrain: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom:17,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
  })
};
let activeBase = BASE.map.addTo(map);

const markerLayer = L.layerGroup().addTo(map);
const routeLayer  = L.layerGroup().addTo(map);
const markers = {};

function pin(s){
  return L.divIcon({
    className:'',
    html:`<span class="pinnum" style="background:${dayColor(s.day)}">${s.i}</span>`,
    iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-14]
  });
}

STOPS.forEach(s => {
  const m = L.marker([s.lat, s.lon], {icon:pin(s), title:s.n, riseOnHover:true});
  const g = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;
  m.bindPopup(
    `<b>${s.i}. ${s.n}</b>` +
    `<span class="pm">${s.d} &middot; ${s.tm} &middot; ${s.ft.toLocaleString()} ft</span>` +
    `${s.note}<br><br><a href="${dir}" target="_blank" rel="noopener">Directions &rarr;</a> &nbsp;&middot;&nbsp; ` +
    `<a href="${g}" target="_blank" rel="noopener">View in Maps</a>`
  );
  markers[s.i] = m;
});

let current = 'all';

function drawRoute(k){
  const ids = ROUTES[k]; if(!ids) return;
  const pts = ids.map(id => [byId[id].lat, byId[id].lon]);
  L.polyline(pts, {color:dayColor(k), weight:3.5, opacity:.85, dashArray:'7,7', lineJoin:'round'}).addTo(routeLayer);
}

function render(sel){
  current = sel;
  markerLayer.clearLayers();
  routeLayer.clearLayers();

  const show = STOPS.filter(s => sel === 'all' ? true : (s.day === sel || s.day === 0));
  show.forEach(s => markerLayer.addLayer(markers[s.i]));

  if(sel === 'all'){ [1,2,3,4].forEach(drawRoute); } else if(sel !== 0){ drawRoute(sel); }

  const fitStops = (sel === 'all' ? STOPS : show).filter(s => s.n !== 'Lake Arrowhead, CA');
  if(fitStops.length){
    map.fitBounds(L.latLngBounds(fitStops.map(s => [s.lat, s.lon])).pad(0.15));
  }

  document.querySelectorAll('.daytab').forEach(b => {
    const on = b.dataset.k === String(sel);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  buildList(show, sel);
}

function buildList(show, sel){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let cur = null, grp = null;
  const ordered = sel === 'all'
    ? show.slice().sort((a,b) => a.day - b.day || a.i - b.i)
    : show.slice().sort((a,b) => (a.day === 0) - (b.day === 0) || a.i - b.i);

  ordered.forEach(s => {
    if(s.d !== cur){
      cur = s.d;
      grp = document.createElement('section');
      grp.className = 'daygroup';
      const meta = DAYS.find(d => d.k === s.day);
      const h = document.createElement('div');
      h.className = 'dayhead';
      h.innerHTML = `<span class="d">${meta.label}</span><span class="t">${meta.short}</span>`;
      grp.appendChild(h);
      list.appendChild(grp);
    }
    const b = document.createElement('button');
    b.className = 'stop'; b.type = 'button';
    b.innerHTML =
      `<span class="row"><span class="pinmini" style="background:${dayColor(s.day)}">${s.i}</span>` +
      `<span class="nm">${s.n}</span></span>` +
      `<span class="meta">${s.tm} &middot; ${s.ft.toLocaleString()} ft</span>`;
    b.addEventListener('click', () => {
      map.setView([s.lat, s.lon], 14);
      markers[s.i].openPopup();
    });
    grp.appendChild(b);
  });
}

// day selector
const tabs = document.getElementById('daytabs');
[{k:'all', label:'Whole trip', short:''}].concat(DAYS.map(d => ({k:d.k, label:d.label, short:d.short})))
  .forEach(d => {
    const b = document.createElement('button');
    b.className = 'daytab'; b.type = 'button'; b.dataset.k = d.k;
    b.innerHTML = d.k === 'all'
      ? `<span class="dl">Whole trip</span>`
      : `<span class="dot" style="background:${dayColor(d.k)}"></span><span class="dl">${d.label}</span>`;
    b.addEventListener('click', () => render(d.k === 'all' ? 'all' : Number(d.k)));
    tabs.appendChild(b);
  });

// base layer switch
document.querySelectorAll('.basebtn').forEach(b => {
  b.addEventListener('click', () => {
    map.removeLayer(activeBase);
    activeBase = BASE[b.dataset.base].addTo(map);
    document.querySelectorAll('.basebtn').forEach(x => x.classList.toggle('on', x === b));
  });
});

render('all');
</script>
</body>
</html>
